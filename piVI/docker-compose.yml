services:

  postgres:
    image: postgres:17
    container_name: spotify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotify
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: spotify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ml:
    build: ./ml
    container_name: spotify-ml
    volumes:
      - ./data:/app/data
      - ./ml:/app
    working_dir: /app
    command: tail -f /dev/null

  backend:
    build: ./backend
    container_name: spotify-backend
    ports:
      - "8000:8000"
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_LIVE_FALLBACK: ${YOUTUBE_LIVE_FALLBACK:-false}
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - postgres

  nest-api:
    build: ./nest-api
    container_name: spotify-nest-api
    ports:
      - "8001:8001"
    environment:
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-playlists}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      - ./nest-api:/app
      - /app/node_modules
    depends_on:
      - postgres

volumes:
  postgres_data: